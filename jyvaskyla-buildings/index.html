<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jyväskylä: every building by year</title>
<meta name="description" content="How Jyväskylä grew, building by building: an interactive 3D map of every building and the year it was built.">
<script>
  // pick theme and language before anything draws (no flash)
  (function () {
    let th = null, lg = null;
    try { th = localStorage.getItem('vr-theme'); lg = localStorage.getItem('vr-lang'); } catch (e) {}
    th = th || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    lg = lg || ((navigator.language || '').toLowerCase().startsWith('fi') ? 'fi' : 'en');
    document.documentElement.dataset.theme = th; document.documentElement.lang = lg;
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/deck.gl@9.1.14/dist.min.js"></script>
<style>
  :root[data-theme="light"] {
    --bg: #f2ede1; --panel: rgba(255, 255, 255, .9); --panel-solid: #ffffff; --panel-2: #f2f4f7; --hover: rgba(28, 36, 51, .05);
    --ink: #1c2433; --muted: #586276; --faint: #7d8699; --line: rgba(28, 36, 51, .13); --accent: #1f6f78; --on-ink: #ffffff;
    --grid: rgba(31, 111, 120, .09); --shadow: 0 10px 30px rgba(28, 36, 51, .12);
  }
  :root[data-theme="dark"] {
    --bg: #121a2b; --panel: rgba(24, 31, 47, .88); --panel-solid: #181f2f; --panel-2: #1d2537; --hover: rgba(255, 255, 255, .05);
    --ink: #eceff6; --muted: #98a1b6; --faint: #6f788d; --line: rgba(220, 226, 240, .12); --accent: #e2b66b; --on-ink: #121826;
    --grid: rgba(226, 182, 107, .08); --shadow: 0 10px 30px rgba(0, 0, 0, .35);
  }
  :root { --display: Unbounded, "Arial Black", sans-serif; --text: "Instrument Sans", system-ui, sans-serif; color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--text); overflow: hidden; }
  a { color: inherit; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  #map { position: absolute; inset: 0; }
  .maplibregl-ctrl-attrib, .maplibregl-ctrl-logo { display: none !important; }

  /* ---------- header ---------- */
  header { position: absolute; left: 0; right: 0; top: 0; z-index: 20; display: flex; align-items: center; gap: 24px; padding: 14px 22px;
    background: linear-gradient(color-mix(in srgb, var(--bg) 95%, transparent), color-mix(in srgb, var(--bg) 75%, transparent) 65%, transparent); }
  .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
  .brand { align-self: flex-start; }
  .brand svg { width: 42px; height: 42px; flex: none; align-self: center; }
  .brand b { display: block; font: 800 clamp(30px, 3.4vw, 48px)/.95 var(--display); letter-spacing: -.035em; }
  .brand span { display: block; font-size: 13px; color: var(--muted); margin-top: 6px; }
  .brand b { background: linear-gradient(95deg, #c0261a 0%, #e8552a 30%, #f08a24 55%, #1fa37a 80%, #2f6fd0 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 2px 6px rgba(255, 255, 255, .55)); }
  :root[data-theme="dark"] .brand b { background-image: linear-gradient(95deg, #ff6a4d 0%, #ffb340 32%, #f4d84a 55%, #5fd39a 78%, #6ea8ff 100%);
    filter: drop-shadow(0 2px 10px rgba(0, 0, 0, .55)); }

  nav { display: flex; gap: 4px; }
  nav a, nav button { text-decoration: none; padding: 7px 13px; border-radius: 99px; color: var(--muted); border: 0; background: none; cursor: pointer; font-size: 14px; }
  nav a:hover, nav button:hover { color: var(--ink); background: var(--hover); }
  nav a[aria-current="page"] { color: var(--on-ink); background: var(--ink); }
  .tools { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .maker { font-size: 13.5px; color: var(--muted); text-decoration: none; margin-right: 6px; }
  .maker b { color: var(--ink); font-weight: 600; border-bottom: 1px solid color-mix(in srgb, var(--ink) 35%, transparent); }
  .maker:hover b { border-color: var(--accent); }
  .iconbtn { height: 34px; min-width: 34px; padding: 0 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--panel);
    display: inline-grid; place-items: center; cursor: pointer; font-size: 12.5px; font-weight: 600; }
  .iconbtn:hover { border-color: var(--accent); }
  .iconbtn svg { width: 16px; height: 16px; }

  .glass { background: var(--panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); }

  /* ---------- year dial ---------- */
  #dial { position: absolute; left: 22px; bottom: 22px; z-index: 15; width: 188px; height: 188px; border-radius: 50%; padding: 0; border: 0;
    background: radial-gradient(circle, var(--panel-solid) 0 58%, color-mix(in srgb, var(--panel-solid) 70%, transparent) 72%, transparent 73%);
    cursor: pointer; filter: drop-shadow(0 8px 18px rgba(0, 0, 0, .14)); }
  #dial svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  #dial .centre { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
  #dial .yr { font: 800 25px/1 var(--display); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  #dial .ct { font-size: 11.5px; color: var(--muted); margin-top: 5px; font-variant-numeric: tabular-nums; }
  #dial .pp { margin: 7px auto 0; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--on-ink); font-size: 10px; }
  #dial:hover .pp { background: var(--accent); }

  /* ---------- time ribbon ---------- */
  #ribbon { position: absolute; left: 228px; right: 22px; bottom: 26px; z-index: 14; height: 86px; padding: 12px 18px 8px; }
  #ribbon .track { position: relative; height: 48px; }
  #hist { position: absolute; inset: 0; width: 100%; height: 100%; }
  #slider { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: ew-resize; }
  #ticks { position: relative; height: 16px; font-size: 11px; color: var(--faint); margin-top: 4px; }
  #ticks span { position: absolute; transform: translateX(-50%); font-variant-numeric: tabular-nums; }
  #ribbon .speed { position: absolute; right: 14px; top: -36px; display: flex; gap: 4px; }
  #ribbon .speed button { border: 1px solid var(--line); background: var(--panel); border-radius: 99px; padding: 3px 11px; font-size: 12px; color: var(--muted); cursor: pointer; }
  #ribbon .speed button[aria-pressed="true"] { color: var(--on-ink); background: var(--ink); }

  /* ---------- era panel ---------- */
  #rail { position: absolute; right: 22px; top: 104px; z-index: 15; width: 268px; padding: 14px 10px 10px; max-height: calc(100% - 222px); overflow: auto; }
  #rail h2 { margin: 0 10px 6px; font: 600 13px/1.3 var(--display); }
  .era { display: grid; grid-template-columns: 16px 1fr auto; gap: 11px; align-items: center; width: 100%; text-align: left;
    padding: 6px 10px; border: 0; border-radius: 12px; background: none; cursor: pointer; }
  .era:hover { background: var(--hover); }
  .era.dim { opacity: .35; }
  .sw { width: 16px; height: 16px; border-radius: 4px; box-shadow: inset 0 -5px 0 rgba(0, 0, 0, .18), 0 1px 3px rgba(0, 0, 0, .18); }
  .era b { display: block; font-weight: 600; font-size: 13.5px; }
  .era small { display: block; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .era .n { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .toggle { display: flex; align-items: center; gap: 9px; margin: 10px 10px 2px; font-size: 13px; color: var(--muted); cursor: pointer; }
  .toggle input { accent-color: var(--accent); width: 16px; height: 16px; }

  /* ---------- building drawer ---------- */
  #drawer { position: absolute; right: 22px; top: 104px; z-index: 16; width: 330px; padding: 18px 18px 16px; display: none; }
  .x { position: absolute; right: 12px; top: 10px; width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--hover); cursor: pointer; font-size: 17px; z-index: 2; }
  .bname { font: 600 19px/1.25 var(--display); letter-spacing: -.01em; padding-right: 30px; }
  .baddr { color: var(--muted); margin-top: 3px; }
  .byear { margin: 12px 0 4px; font: 800 40px/1 var(--display); letter-spacing: -.03em; }
  .chip { display: inline-flex; align-items: center; gap: 7px; padding: 3px 11px 3px 6px; border-radius: 99px; font-size: 12.5px; font-weight: 600;
    border: 1.5px solid var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }
  .chip i { width: 12px; height: 12px; border-radius: 3px; background: var(--c); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 1px; margin: 14px 0; border-radius: 12px; overflow: hidden; background: var(--line); }
  .stats div { background: var(--panel-2); padding: 9px 10px; }
  .stats b { display: block; font: 600 16px/1.2 var(--display); }
  .stats span { font-size: 12px; color: var(--muted); }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 99px; text-decoration: none;
    font-weight: 600; font-size: 14px; color: var(--on-ink); background: var(--ink); border: 0; cursor: pointer; }
  .btn:hover { background: var(--accent); color: var(--on-ink); }
  .est { font-size: 12.5px; color: var(--muted); margin: 6px 0 0; }

  /* ---------- pages ---------- */
  .page { position: absolute; z-index: 18; display: none; }
  .detail { left: 22px; top: 100px; bottom: 22px; width: min(480px, calc(100% - 44px)); overflow: auto; padding: 0 0 22px; }
  .detail .inner { padding: 20px 26px 0; }
  .detail .photo img { display: block; width: 100%; height: 230px; object-fit: cover; border-radius: 18px 18px 0 0; }
  .plan { height: 190px; border-bottom: 1px solid var(--line); border-radius: 18px 18px 0 0; position: relative;
    background-color: var(--panel-2); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 22px 22px; }
  .plan svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .detail h1 { font: 800 28px/1.15 var(--display); letter-spacing: -.02em; margin: 0; }
  .detail h2 { font: 600 14px/1.3 var(--display); margin: 22px 0 8px; }
  .detail dl { display: grid; grid-template-columns: 140px 1fr; gap: 6px 14px; margin: 0; font-size: 14px; }
  .detail dt { color: var(--muted); } .detail dd { margin: 0; }
  .detail ul { margin: 0; padding-left: 18px; }
  .detail .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .detail .links a { text-decoration: none; padding: 7px 13px; border-radius: 99px; border: 1px solid var(--line); font-size: 13.5px; }
  .detail .links a:hover { border-color: var(--accent); }
  .twins { display: grid; gap: 6px; }
  .twins a { display: flex; justify-content: space-between; gap: 12px; text-decoration: none; padding: 9px 12px; border-radius: 12px; background: var(--panel-2); font-size: 14px; }
  .twins a:hover { outline: 1px solid var(--accent); }
  .twins span { color: var(--muted); white-space: nowrap; }
  .back { display: inline-block; margin-bottom: 14px; font-size: 13.5px; color: var(--muted); text-decoration: none; }
  .back:hover { color: var(--ink); }
  .ids { margin-top: 18px; font-size: 12.5px; color: var(--faint); }

  #list { inset: 0; background: color-mix(in srgb, var(--bg) 93%, transparent); backdrop-filter: blur(10px); overflow: auto; padding: 120px 22px 40px; }
  #list .wrap { max-width: 1040px; margin: 0 auto; }
  #list h1 { font: 800 clamp(30px, 5vw, 50px)/1 var(--display); letter-spacing: -.03em; margin: 0 0 8px; }
  #list .lede { color: var(--muted); margin: 0 0 22px; max-width: 64ch; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .controls input[type=search], .controls select { background: var(--panel-solid); border: 1px solid var(--line); color: var(--ink);
    border-radius: 99px; padding: 10px 16px; font: inherit; font-size: 14px; }
  .controls input[type=search] { flex: 1 1 260px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
  .chips button { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--panel-solid); border-radius: 99px;
    padding: 5px 12px 5px 8px; font-size: 13px; color: var(--muted); cursor: pointer; }
  .chips button[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); }
  .chips i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
  .rows { border-top: 1px solid var(--line); }
  .rows a { display: grid; grid-template-columns: 16px 1fr auto auto; gap: 16px; align-items: center; padding: 12px 6px; text-decoration: none; border-bottom: 1px solid var(--line); }
  .rows a:hover { background: var(--hover); }
  .rows .t b { display: block; font-weight: 600; }
  .rows .t span { color: var(--muted); font-size: 13.5px; }
  .rows .fl { color: var(--muted); font-size: 13px; text-align: right; white-space: nowrap; }
  .rows .y { font: 600 20px/1 var(--display); font-variant-numeric: tabular-nums; min-width: 72px; text-align: right; }
  .pager { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 18px; color: var(--muted); font-size: 14px; }
  .pager button { border: 1px solid var(--line); background: var(--panel-solid); border-radius: 99px; padding: 8px 16px; cursor: pointer; }
  .pager button:disabled { opacity: .35; cursor: default; }
  .empty { padding: 40px 6px; color: var(--muted); }

  dialog { max-width: 560px; width: calc(100% - 32px); border: 1px solid var(--line); border-radius: 22px; background: var(--panel-solid); color: var(--ink); padding: 26px 28px; }
  dialog::backdrop { background: rgba(10, 14, 24, .5); backdrop-filter: blur(4px); }
  dialog h2 { font: 800 24px/1.2 var(--display); margin: 0 0 10px; }
  dialog h3 { font: 600 14px/1.3 var(--display); margin: 18px 0 6px; }
  dialog p { margin: 0 0 10px; color: var(--muted); }
  dialog .close { float: right; }

  /* big film year */
  #bigYear { position: absolute; left: 24px; top: 108px; z-index: 13; pointer-events: none; opacity: 0; transform: translateY(-8px);
    transition: opacity .5s, transform .5s; }
  body.playing[data-route="map"] #bigYear { opacity: 1; transform: none; }
  #bigYear b { display: block; font: 800 clamp(64px, 9vw, 118px)/.9 var(--display); letter-spacing: -.05em; font-variant-numeric: tabular-nums;
    color: var(--ink); text-shadow: 0 2px 24px color-mix(in srgb, var(--bg) 80%, transparent); }
  #bigYear span { display: inline-flex; align-items: center; gap: 8px; margin-top: 10px; padding: 5px 12px 5px 8px; border-radius: 99px;
    background: var(--panel); border: 1px solid var(--line); font-size: 13.5px; font-weight: 600; backdrop-filter: blur(10px); }
  #bigYear span i { width: 12px; height: 12px; border-radius: 3px; background: var(--c, #888); }
  #hint { position: absolute; left: 50%; transform: translateX(-50%); white-space: nowrap; bottom: 124px; z-index: 13; font-size: 12px; color: var(--muted); background: var(--panel);
    border: 1px solid var(--line); padding: 3px 11px; border-radius: 99px; pointer-events: none; transition: opacity .6s; }
  body:not([data-route="map"]) #hint { opacity: 0; }
  @media (hover: none), (max-width: 900px) { #hint { display: none; } }
  #map.turning, #map.turning canvas { cursor: grabbing !important; }
  #map.panning, #map.panning canvas { cursor: move !important; }

  #credits { position: absolute; right: 22px; bottom: 4px; z-index: 14; font-size: 11px; color: var(--muted); background: var(--panel); padding: 1px 10px; border-radius: 99px; }
  #credits a { color: var(--ink); }
  #loading { position: absolute; inset: 0; z-index: 30; display: grid; place-content: center; text-align: center; background: var(--bg); transition: opacity .6s; }
  #loading p { color: var(--muted); }
  .stack { width: 70px; height: 70px; margin: 0 auto 14px; display: flex; flex-direction: column-reverse; align-items: center; gap: 4px; }
  .stack i { display: block; height: 11px; border-radius: 3px; animation: rise 1.8s ease-in-out infinite; transform-origin: bottom; opacity: 0; }
  .stack i:nth-child(1) { width: 64px; background: #b3261a; animation-delay: 0s; }
  .stack i:nth-child(2) { width: 52px; background: #f08a24; animation-delay: .25s; }
  .stack i:nth-child(3) { width: 40px; background: #8fb52f; animation-delay: .5s; }
  .stack i:nth-child(4) { width: 28px; background: #2f6fd0; animation-delay: .75s; }
  @keyframes rise { 0% { opacity: 0; transform: translateY(-14px); } 25%, 75% { opacity: 1; transform: none; } 100% { opacity: 0; } }

  body[data-route="list"] #rail, body[data-route="list"] #drawer, body[data-route="list"] #dial, body[data-route="list"] #ribbon { display: none !important; }
  body[data-route="detail"] #rail, body[data-route="detail"] #drawer { display: none !important; }
  body[data-route="detail"] #dial { left: auto; right: 22px; }
  body[data-route="detail"] #ribbon { left: 524px; right: 232px; }

  #railBtn { display: none; position: absolute; right: 14px; bottom: 104px; z-index: 15; }
  @media (max-width: 900px) {
    header { gap: 10px; padding: 10px 12px; flex-wrap: wrap; }
    .brand span { display: none; } .maker { display: none; } .brand b { font-size: 26px; } .brand svg { width: 32px; height: 32px; }
    nav a, nav button { padding: 6px 9px; font-size: 13px; }
    #rail { display: none; top: auto; bottom: 150px; left: 12px; right: 12px; width: auto; max-height: 45%; }
    #rail.open { display: block; }
    #railBtn { display: inline-flex; }
    #dial { width: 132px; height: 132px; left: 12px; bottom: 12px; } #dial .yr { font-size: 19px; } #dial .ct { display: none; }
    #ribbon { left: 152px; right: 12px; bottom: 16px; height: 76px; padding: 10px 12px 6px; } #ribbon .speed { display: none; }
    #drawer { left: 12px; right: 12px; width: auto; top: auto; bottom: 156px; }
    .detail { left: 0; right: 0; top: auto; bottom: 0; height: 62%; width: 100%; border-radius: 22px 22px 0 0; }
    body[data-route="detail"] #dial, body[data-route="detail"] #ribbon { display: none; }
    .rows a { grid-template-columns: 14px 1fr auto; } .rows .fl { display: none; }
    #credits { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .stack i { animation: none; opacity: 1; } }
</style>
</head>
<body data-route="map">
<div id="map"></div>

<div id="loading"><div class="stack" aria-hidden="true"><i></i><i></i><i></i><i></i></div><p id="loadingText" data-t="loading"></p></div>

<header>
  <a class="brand" href="/" data-link aria-label="Jyväskylä">
    <svg viewBox="0 0 40 40" aria-hidden="true">
      <rect x="4" y="27" width="32" height="8" rx="2" fill="#b3261a"/><rect x="8" y="18" width="24" height="8" rx="2" fill="#f08a24"/>
      <rect x="12" y="9" width="16" height="8" rx="2" fill="#8fb52f"/><rect x="16" y="2" width="8" height="6" rx="1.5" fill="#2f6fd0"/>
    </svg>
    <div><b>Jyväskylä</b><span data-t="tagline"></span></div>
  </a>
  <nav aria-label="Main">
    <a href="/" data-link data-nav="map" data-t="navMap"></a>
    <a href="/all-buildings" data-link data-nav="list" data-t="navList"></a>
    <button type="button" id="aboutBtn" data-t="navAbout"></button>
  </nav>
  <div class="tools">
    <a class="maker" href="https://arifultushar.online" target="_blank" rel="noopener"><span data-t="madeBy"></span> <b>Md Ariful Islam</b></a>
    <button class="iconbtn" type="button" id="langBtn"></button>
    <button class="iconbtn" type="button" id="themeBtn"></button>
  </div>
</header>

<aside id="rail" class="glass">
  <h2 data-t="eras"></h2>
  <div id="eras"></div>
  <label class="toggle"><input type="checkbox" id="sheds" checked> <span data-t="showSheds"></span></label>
</aside>
<button id="railBtn" class="btn" type="button" aria-expanded="false" data-t="eras"></button>

<section id="drawer" class="glass" aria-live="polite"></section>

<button id="dial" type="button">
  <svg viewBox="0 0 200 200" id="rings"></svg>
  <span class="centre"><span class="yr" id="yr"></span><span class="ct" id="ct"></span><span class="pp" id="pp">▶</span></span>
</button>

<div id="ribbon" class="glass">
  <div class="speed" role="group">
    <button type="button" data-speed="1" aria-pressed="true" data-t="calm"></button>
    <button type="button" data-speed="2" aria-pressed="false" data-t="fast"></button>
  </div>
  <div class="track">
    <svg id="hist" preserveAspectRatio="none" aria-hidden="true"></svg>
    <input id="slider" type="range">
  </div>
  <div id="ticks"></div>
</div>

<article id="detail" class="page detail glass" aria-live="polite"></article>
<section id="list" class="page"></section>
<div id="credits"></div>
<div id="bigYear" aria-hidden="true"><b id="byNum"></b><span id="byEra"><i></i><em style="font-style:normal"></em></span></div>
<div id="hint" data-t="hint"></div>

<dialog id="about">
  <button class="btn close" type="button" id="aboutClose" data-t="close"></button>
  <div id="aboutBody"></div>
</dialog>

<script>
/* ======================================= settings ======================================= */
const CONFIG = {
  // the site works at the root (local server) and in the /jyvaskyla-buildings folder of arifultushar.online

/* ---------------------------------- rain animation (GPU) ----------------------------------
   While the film plays, every building falls from the sky in the year it was finished, drifting in

const growModule = {
  name: 'grow',
  vs: `
uniform growUniforms { float year; float rise; float playing; float hoverA; float hoverAAmt; float hoverB; float hoverBAmt; float sel; float selAmt; } grow;
in vec3 growData;          // year built, floors, building index
in vec2 growCenter;        // footprint centre (lon, lat)

float grow_lift;

  inject: {
    'vs:#main-start': `
    grow_g = clamp((grow.year - growData.x + 1.0) / grow.rise, 0.0, 1.0);
    grow_lift = 0.0;
    if (abs(growData.z - grow.hoverA) < 0.5) grow_lift = max(grow_lift, grow.hoverAAmt);
    if (abs(growData.z - grow.hoverB) < 0.5) grow_lift = max(grow_lift, grow.hoverBAmt);
    grow_sel = abs(growData.z - grow.sel) < 0.5 ? grow.selAmt : 0.0;
    `,
    'vs:DECKGL_FILTER_GL_POSITION': `
    if (grow_g < 0.002) {
      position = vec4(2.0, 2.0, 2.0, 1.0);
    } else {

      bool moved = false;

    <button class="x" type="button" aria-label="${t('close')}">×</button>
    <div class="bname">${esc(titleOf(f, d))}</div>
    ${d.ad && d.nm ? `<div class="baddr">${esc(d.ad)}</div>` : d.pc ? `<div class="baddr">${esc(d.pc)}</div>` : ''}
    <div class="byear">${yearTxt(p)}</div>
    ${chip(p.era)} ${p.e ? `<p class="est">${t('estimate')}</p>` : ''}
    ${statsHtml(f, d, false)}
    <a class="btn" href="${pageUrl(f)}" data-link>${t('openPage')}</a>`;
  $('drawer').style.display = 'block'; $('rail').style.visibility = 'hidden';
  $('drawer').querySelector('.x').onclick = closeDrawer;
}
function closeDrawer() {
  $('drawer').style.display = 'none'; $('rail').style.visibility = '';
  if (S.route === 'map' && S.selected >= 0) { S.selected = -1; H.selAmt = 0; render(); }
}

/* ---------------------------------- footprint drawing (detail page) ---------------------------------- */
function planSvg(f) {
  const g = f.geometry, polys = g.type === 'MultiPolygon' ? g.coordinates : [g.coordinates];
  const [cx, cy] = f.properties.c, kx = 111320 * Math.cos(cy * Math.PI / 180), ky = 110540;
  const P = polys.map(poly => poly.map(ring => ring.map(([x, y]) => [(x - cx) * kx, -(y - cy) * ky])));
  const flat = P.flat(2);
  const minX = Math.min(...flat.map(q => q[0])), maxX = Math.max(...flat.map(q => q[0]));
  const minY = Math.min(...flat.map(q => q[1])), maxY = Math.max(...flat.map(q => q[1]));
  const W = 480, Hh = 190, pad = 38, sc = Math.min((W - pad * 2) / (maxX - minX || 1), (Hh - pad * 2) / (maxY - minY || 1));
  const ox = (W - (maxX - minX) * sc) / 2 - minX * sc, oy = (Hh - (maxY - minY) * sc) / 2 - minY * sc;
  const d = P.map(poly => poly.map(ring => 'M' + ring.map(([x, y]) => `${(x * sc + ox).toFixed(1)},${(y * sc + oy).toFixed(1)}`).join('L') + 'Z').join('')).join('');
  const nice = [2, 5, 10, 20, 50, 100, 200, 500].find(m => m * sc >= 50) || 500, bar = nice * sc;
  const col = eraColor(f.properties.era);
  return `<div class="plan" role="img" aria-label="${esc(titleOf(f))}"><svg viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="xMidYMid meet">
    <path d="${d}" fill="${col}" fill-opacity=".85" fill-rule="evenodd" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>
    <g transform="translate(22 ${Hh - 22})" style="fill:var(--muted);stroke:var(--muted)" font-size="11" font-family="Instrument Sans, sans-serif">
      <line x1="0" y1="0" x2="${bar.toFixed(1)}" y2="0" stroke-width="2"/><line x1="0" y1="-4" x2="0" y2="4" stroke-width="2"/><line x1="${bar.toFixed(1)}" y1="-4" x2="${bar.toFixed(1)}" y2="4" stroke-width="2"/>
      <text x="${(bar + 8).toFixed(1)}" y="4" stroke="none">${nice} ${t('scale')}</text></g>
    <g transform="translate(${W - 30} 30)" style="fill:var(--muted)" font-size="11" font-family="Instrument Sans, sans-serif">
      <path d="M0,-12 L5,4 L0,0 L-5,4 Z"/><text x="0" y="17" text-anchor="middle">N</text></g></svg></div>`;
}
async function wikiPhoto(qid) {
  try {
    const r = await fetch(`https://www.wikidata.org/w/api.php?action=wbgetclaims&entity=${encodeURIComponent(qid)}&property=P18&format=json&origin=*`);
    const file = (await r.json()).claims?.P18?.[0]?.mainsnak?.datavalue?.value;
    return file ? encodeURIComponent(file.replace(/ /g, '_')) : null;
  } catch (e) { return null; }
}
const dist2 = (a, b) => { const dx = (a[0] - b[0]) * Math.cos(b[1] * Math.PI / 180), dy = a[1] - b[1]; return dx * dx + dy * dy; };

/* ---------------------------------- detail page ---------------------------------- */
let lastDetailId = null;
function renderDetail(id) {
  const f = byId.get(id), el = $('detail');
  if (!f) {
    el.innerHTML = `<div class="inner"><a class="back" href="${url('/all-buildings')}" data-link>${t('backList')}</a>
      <h1>${t('notFound')}</h1><p>${esc(t('notFoundText', id))}</p></div>`;
    return;
  }
  const p = f.properties, d = D(f);
  if (S.selected !== p.i) H.selAmt = REDUCED ? 1 : 0;
  S.selected = p.i; kick();
  if (!S.playing && (p.y == null || S.year < p.y)) S.year = TODAY;
  render();
  if (lastDetailId !== id) {
    lastDetailId = id;
    const fly = REDUCED ? 0 : 1700;
    const zoom = Math.max(16.2, Math.min(18.2, 18.4 - Math.log2(Math.sqrt(p.a || 200) / 12)));   // small buildings: come closer
    map.flyTo({ center: p.c, zoom, pitch: 55, bearing: map.getBearing() + 20, duration: fly, essential: true,
      padding: innerWidth > 900 ? { left: 520, top: 60, right: 40, bottom: 120 } : { bottom: innerHeight * .6 } });
    if (fly) setTimeout(() => { if (S.selected === p.i) { H.selAmt = 0; kick(); } }, fly - 150);   // pop up as the camera arrives
  }
  const row = (k, v) => (v == null || v === '' ? '' : `<dt>${k}</dt><dd>${v}</dd>`);
  const sec = (h, rows) => (rows.trim() ? `<h2>${h}</h2><dl>${rows}</dl>` : '');
  const others = d.aa ? d.aa.split('; ').filter(a => a !== d.ad) : [];
  const wp = d.wp ? (() => { const [l, ...x] = d.wp.split(':'); return `https://${l}.wikipedia.org/wiki/${encodeURIComponent(x.join(':').replace(/ /g, '_'))}`; })() : null;
  const [lon, lat] = p.c;
  const twins = p.y == null ? [] : (byYear.get(p.y) || []).filter(x => x !== f).map(x => ({ f: x, d: dist2(x.properties.c, p.c) })).sort((a, b) => a.d - b.d).slice(0, 6);
  const v = k => { const x = pick(d, k); return x ? esc(x) : null; };

  el.innerHTML = `
    <div class="photo" id="dPhoto">${planSvg(f)}</div>
    <div class="inner">
      <a class="back" href="${url('/')}" data-link>${t('backMap')}</a>
      <h1>${esc(titleOf(f, d))}</h1>
      ${d.nm && d.ad ? `<div class="baddr">${esc(d.ad)}${d.pc ? ', ' + esc(d.pc) : ''}</div>` : d.pc ? `<div class="baddr">${esc(d.pc)}</div>` : ''}
      <div class="byear">${yearTxt(p)}</div>
      ${chip(p.era)}
      ${p.e ? `<p class="est">${t('estimate')}</p>` : ''}
      ${d.y0 && d.y1 && d.y0 !== d.y1 ? `<p class="est">${t('holds', p.n, d.y0, d.y1)}</p>` : ''}
      ${statsHtml(f, d, true)}
      ${sec(t('secBuilding'), row(t('rType'), esc(typeOf(f, d) || '')) + row(t('rUse'), v('us')) + row(t('rKind'), kdOk(d) && d.nm ? esc(cap(kindTxt(d.kd))) : null))}
      ${sec(t('secBuilt'), row(t('rStructure'), v('lb')) + row(t('rFacade'), v('fm')) + row(t('rMethod'), v('cm')))}
      ${sec(t('secEnergy'), row(t('rHeating'), v('hm')) + row(t('rSource'), v('he')))}
      ${sec(t('secHeritage'), row(t('rProtected'), d.pr ? t('yes') : null) + row(t('rSignif'), v('ch')))}
      ${d.in ? `<h2>${t('secInside')}</h2><ul>${insideTxt(d.in).map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
      ${others.length ? `<h2>${t('secOther')}</h2><p>${others.map(esc).join(', ')}</p>` : ''}
      <div class="links">
        ${wp ? `<a href="${wp}" target="_blank" rel="noopener">Wikipedia</a>` : ''}
        ${d.ws ? `<a href="${esc(d.ws)}" target="_blank" rel="noopener">${t('website')}</a>` : ''}
        <a href="https://www.mapillary.com/app/?lat=${lat}&lng=${lon}&z=18" target="_blank" rel="noopener">${t('streetPhotos')}</a>
        <a href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${lat},${lon}" target="_blank" rel="noopener">Street View</a>
        ${d.osm ? `<a href="${d.osm}" target="_blank" rel="noopener">OpenStreetMap</a>` : ''}
      </div>
      ${twins.length ? `<h2>${t('twins', p.y)}</h2><div class="twins">${twins.map(x =>
        `<a href="${pageUrl(x.f)}" data-link>${esc(titleOf(x.f))}<span>${t('away', fmt(Math.round(Math.sqrt(x.d) * 111320)))}</span></a>`).join('')}</div>` : ''}
      <div class="ids">${t('buildingId')} ${esc(p.id || '—')}${d.pid ? ', ' + t('property') + ' ' + esc(d.pid) : ''}</div>
    </div>`;
  el.scrollTop = 0;
  document.title = `${titleOf(f, d)}, Jyväskylä`;
  if (d.wd) wikiPhoto(d.wd).then(n => { const box = $('dPhoto'); if (n && box && lastDetailId === id) box.innerHTML =
    `<a href="https://commons.wikimedia.org/wiki/File:${n}" target="_blank" rel="noopener" title="Wikimedia Commons"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/${n}?width=900" alt="${esc(titleOf(f, d))}"></a>`; });
}

/* ---------------------------------- all buildings ---------------------------------- */
const L = { q: '', era: null, sort: 'old', noAddr: false, page: 0 };
function buildIndex() {
  index = all.map(f => {
    const p = f.properties, d = D(f);
    return { f, p, title: titleOf(f, d), sub: [d.nm ? d.ad : null, typeOf(f, d)].filter(Boolean).join(', '),
      key: [d.nm, d.ad, d.aa, p.id, d.kd, d.in].filter(Boolean).join(' ').toLowerCase(), has: !!(d.ad || d.nm), area: d.gfa || p.a || 0 };
  });
}
function renderList() {
  const el = $('list');
  if (!el.dataset.built) {
    el.dataset.built = '1';
    el.innerHTML = `<div class="wrap">
      <h1>${t('listTitle')}</h1><p class="lede" id="lede"></p>
      <div class="controls">
        <input type="search" id="q" placeholder="${t('search')}" aria-label="${t('search')}" value="${esc(L.q)}">
        <select id="sort" aria-label="Sort">${['Old', 'New', 'Name', 'Big', 'Tall'].map(k => `<option value="${k.toLowerCase()}"${L.sort === k.toLowerCase() ? ' selected' : ''}>${t('sort' + k)}</option>`).join('')}</select>
        <label class="toggle" style="margin:0"><input type="checkbox" id="noAddr"${L.noAddr ? ' checked' : ''}> ${t('noAddr')}</label>
      </div>
      <div class="chips" id="chips"></div>
      <div class="rows" id="rows"></div>
      <div class="pager"><button type="button" id="prev">${t('prev')}</button><span id="pinfo"></span><button type="button" id="next">${t('next')}</button></div>
    </div>`;
    const chips = [{ i: null, label: t('allEras'), color: 'var(--ink)' }, ...ERAS.map((e, i) => ({ i, label: eraLabel(i), color: eraColor(i) })), { i: -1, label: eraLabel(-1), color: eraColor(-1) }];
    $('chips').innerHTML = chips.map(c => `<button type="button" data-i="${c.i}" aria-pressed="${c.i === L.era}"><i style="background:${c.color}"></i>${c.label}</button>`).join('');
    $('chips').querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
      L.era = b.dataset.i === 'null' ? null : +b.dataset.i; L.page = 0;
      $('chips').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); renderRows();
    }));
    let tm; $('q').addEventListener('input', e => { clearTimeout(tm); tm = setTimeout(() => { L.q = e.target.value.trim().toLowerCase(); L.page = 0; renderRows(); }, 160); });
    $('sort').addEventListener('change', e => { L.sort = e.target.value; L.page = 0; renderRows(); });
    $('noAddr').addEventListener('change', e => { L.noAddr = e.target.checked; L.page = 0; renderRows(); });
    $('prev').addEventListener('click', () => { L.page--; renderRows(); el.scrollTop = 0; });
    $('next').addEventListener('click', () => { L.page++; renderRows(); el.scrollTop = 0; });
  }
  renderRows();
  document.title = t('titleList');
}
function renderRows() {
  if (!details) { $('rows').innerHTML = `<p class="empty">${t('loadingNames')}</p>`; $('lede').textContent = ''; return; }
  if (!index) buildIndex();
  const r = index.filter(x => (L.noAddr || x.has) && (L.era === null || x.p.era === L.era) && (!L.q || x.key.includes(L.q)));
  const by = { old: (a, b) => (a.p.y ?? 1e4) - (b.p.y ?? 1e4), new: (a, b) => (b.p.y ?? -1) - (a.p.y ?? -1),
    name: (a, b) => a.title.localeCompare(b.title, 'fi'), big: (a, b) => b.area - a.area, tall: (a, b) => (b.p.h || 0) - (a.p.h || 0) };
  r.sort(by[L.sort]);
  const pages = Math.max(1, Math.ceil(r.length / CONFIG.pageSize));
  L.page = Math.min(Math.max(0, L.page), pages - 1);
  const slice = r.slice(L.page * CONFIG.pageSize, (L.page + 1) * CONFIG.pageSize);
  $('lede').textContent = t('listLede', fmt(r.length), L.q);
  $('rows').innerHTML = slice.length ? slice.map(x => `
    <a href="${pageUrl(x.f)}" data-link>
      <span class="sw" style="background:${eraColor(x.p.era)}"></span>
      <span class="t"><b>${esc(x.title)}</b><span>${esc(x.sub || '')}</span></span>
      <span class="fl">${x.p.s ? fmt(x.p.s) + ' ' + t('floors', x.p.s) : ''}</span>
      <span class="y">${x.p.y ?? '—'}</span>
    </a>`).join('') : `<p class="empty">${t('empty')}</p>`;
  $('pinfo').textContent = t('page', L.page + 1, fmt(pages));
  $('prev').disabled = L.page === 0; $('next').disabled = L.page >= pages - 1;
}

/* ---------------------------------- router ---------------------------------- */
function go(path) { history.pushState({}, '', url(path)); route(); }
document.addEventListener('click', e => {
  const a = e.target.closest('a[data-link]');
  if (!a || e.metaKey || e.ctrlKey || e.shiftKey || a.target === '_blank') return;
  e.preventDefault(); history.pushState({}, '', a.getAttribute('href')); route();
});
addEventListener('popstate', () => route());
function route(redraw) {
  const path = decodeURIComponent(location.pathname.slice(CONFIG.base.length) || '/');
  const m = path.match(/^\/details_building-(.+)$/);
  S.route = m ? 'detail' : path.startsWith('/all-buildings') ? 'list' : 'map';
  document.body.dataset.route = S.route;
  document.querySelectorAll('[data-nav]').forEach(a => { if (a.dataset.nav === S.route) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  $('detail').style.display = S.route === 'detail' ? 'block' : 'none';
  $('list').style.display = S.route === 'list' ? 'block' : 'none';
  $('drawer').style.display = 'none'; $('rail').style.visibility = '';
  if (!all.length) return;
  if (S.route !== 'detail') lastDetailId = null;
  if (S.playing) stop(true);                       // leaving the film: show the city as it is today
  if (S.route === 'detail') { renderDetail(m[1]); }
  else if (S.route === 'list') { S.selected = -1; render(); renderList(); }
  else { if (S.selected >= 0) { S.selected = -1; render(); } document.title = t('titleMap'); }
}

/* ---------------------------------- about ---------------------------------- */
$('aboutBtn').addEventListener('click', () => $('about').showModal());
$('aboutClose').addEventListener('click', () => $('about').close());
addEventListener('keydown', e => { if (e.key === 'Escape' && S.route === 'map') closeDrawer(); });

/* ---------------------------------- start ---------------------------------- */
document.querySelectorAll('a[data-link]').forEach(a => { const h = a.getAttribute('href'); if (h && h.startsWith('/') && CONFIG.base && !h.startsWith(CONFIG.base + '/') && h !== CONFIG.base) a.setAttribute('href', url(h)); });   // header links follow the folder
applyStatic();
loadBasemap();
fetch(url(CONFIG.data))
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(geo => {
    all = geo.features;
    all.forEach((f, i) => {
      const p = f.properties; p.i = i; p.era = eraOf(p.y);
      const g = f.geometry, ring = g.type === 'MultiPolygon' ? g.coordinates[0][0] : g.coordinates[0];
      const s = ring.reduce((a, c) => [a[0] + c[0], a[1] + c[1]], [0, 0]); p.c = [s[0] / ring.length, s[1] / ring.length];
      byId.set(p.id || 'o' + i, f); if (p.id) byId.set('o' + i, f);
      if (p.y != null) { if (!byYear.has(p.y)) byYear.set(p.y, []); byYear.get(p.y).push(f); }
    });
    sortedYears = all.map(f => f.properties.y).filter(y => y != null).sort((a, b) => a - b);
    unknownCount = all.length - sortedYears.length;
    sortedYears.forEach(y => eraTotals[eraOf(y)]++);
    applyShown(); buildDial(); buildEras(); buildRibbon(); buildWarp();
    overlay = new deck.MapboxOverlay({
      interleaved: false, layers: layers(), effects: [lighting()],
      getTooltip: ({ object: o }) => o && {
        html: `<b>${esc(titleOf(o))}</b><br>${yearTxt(o.properties)}`,
        style: { background: TC.tipBg, color: TC.tipInk, border: `1px solid ${TC.tipLine}`, borderRadius: '10px', padding: '6px 10px', fontSize: '12.5px', fontFamily: 'Instrument Sans, sans-serif' }
      }
    });
    map.addControl(overlay);
    route();
    $('loading').style.opacity = 0; setTimeout(() => $('loading').remove(), 650);
    fetch(url(CONFIG.details)).then(r => (r.ok ? r.json() : null)).then(d => {
      details = d; index = null;
      if (S.route === 'list') renderRows();
      if (S.route === 'detail') route(true);
    }).catch(() => {});
    if (S.route === 'map' && !REDUCED && !introDone) {     // first visit: the city builds itself once
      introDone = true; S.year = CONFIG.startYear; const keep = S.speed; S.speed = 2;
      setTimeout(play, 500);
      setTimeout(() => { S.speed = keep; }, 3000 + CONFIG.filmMs / 2 + 300);
    }
  })
  .catch(err => { $('loadingText').innerHTML = t('loadError', esc(err.message)); });
</script>
</body>
